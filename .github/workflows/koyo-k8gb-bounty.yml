name: K8GB paid contribution evidence
on:
  push:
    branches: [koyo/paid-bounty-k8gb-20260909]
    paths: [.github/workflows/koyo-k8gb-bounty.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pluralsh/console
          ref: 1a738b2f7bfdc9a5f0e62737d90a60c89d8caa10
          persist-credentials: false
          sparse-checkout: |
            utils/compatibility
            static/compatibilities
      - name: Collect public source without executing repository scripts
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, subprocess, urllib.request
          root = pathlib.Path('bounty-evidence')
          root.mkdir()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert base == '1a738b2f7bfdc9a5f0e62737d90a60c89d8caa10'
          paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', 'HEAD'], text=True).splitlines()
          (root/'repository-paths.json').write_text(json.dumps(paths, indent=2))
          selected = [p for p in paths if p.startswith(('utils/compatibility/', 'static/compatibilities/')) or p in ('README.md', 'AGENTS.md', 'LICENSE', '.github/pull_request_template.md', '.github/PULL_REQUEST_TEMPLATE.md', 'utils/AGENTS.md', 'static/AGENTS.md')]
          manifest = {'base': base, 'files': {}, 'downloads': {}}
          for name in selected:
              data = subprocess.check_output(['git', 'show', f'HEAD:{name}'])
              target = root/'console'/name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              manifest['files'][name] = {'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          urls = {
            'k8gb-index.yaml': 'https://www.k8gb.io/index.yaml',
            'k8gb-releases.json': 'https://api.github.com/repos/k8gb-io/k8gb/releases?per_page=100',
            'k8gb-readme.md': 'https://raw.githubusercontent.com/k8gb-io/k8gb/96eea4bc70d8df45983309d4f7efdae5332bd7da/README.md',
          }
          for name, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent':'ugin-man-compatibility-evidence'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(10_000_001)
                  assert len(data) <= 10_000_000
                  final_url = response.url
              (root/name).write_bytes(data)
              manifest['downloads'][name] = {'url':url,'final_url':final_url,'sha256':hashlib.sha256(data).hexdigest(),'captured_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'provenance.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps({'base':base,'files':len(selected),'existing_k8gb_paths':[p for p in paths if 'k8gb' in p.lower()]}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k8gb-paid-source-evidence
          path: bounty-evidence/
          retention-days: 7
          include-hidden-files: true
