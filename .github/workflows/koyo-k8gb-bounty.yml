name: K8GB paid contribution evidence
on:
  push:
    branches: [koyo/paid-bounty-k8gb-20260909]
    paths: [.github/workflows/koyo-k8gb-bounty.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pluralsh/console
          ref: 1a738b2f7bfdc9a5f0e62737d90a60c89d8caa10
          persist-credentials: false
          sparse-checkout: |
            utils/compatibility
            static/compatibilities
      - name: Collect and render published charts without deployment
        run: |
          mkdir -p bounty-evidence/wheels
          python3 -m pip download --no-deps colorama==0.4.6 -d bounty-evidence/wheels
          python3 - <<'PY'
          import datetime, hashlib, io, json, pathlib, re, subprocess, tarfile, urllib.request, urllib.parse
          import yaml
          root = pathlib.Path('bounty-evidence')
          for name in ('KUBE_VERSION','static/compatibilities.yaml'):
              target=root/'console'/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(subprocess.check_output(['git','show',f'HEAD:{name}']))
          cap=(root/'console/KUBE_VERSION').read_text().strip()
          helm=subprocess.check_output(['helm','version','--short'],text=True).strip()
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'ugin-man-k8gb-compatibility'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(15_000_001)
              if len(data)>15_000_000:raise ValueError('response exceeds limit')
              return data
          raw=fetch('https://www.k8gb.io/index.yaml')
          (root/'k8gb-index.yaml').write_bytes(raw)
          rows=yaml.safe_load(raw)['entries']['k8gb']
          report={'helm':helm,'kube_cap':cap,'charts':[],'index_sha256':hashlib.sha256(raw).hexdigest()}
          for row in rows:
              if not all(re.fullmatch(r'v?\d+\.\d+\.\d+',str(row.get(k,''))) for k in ('version','appVersion')) or not row.get('kubeVersion') or row.get('deprecated'):
                  continue
              url=urllib.parse.urljoin('https://www.k8gb.io/',row['urls'][0])
              assert urllib.parse.urlsplit(url).hostname=='www.k8gb.io'
              data=fetch(url)
              assert hashlib.sha256(data).hexdigest()==row['digest']
              name='k8gb-'+row['version']+'.tgz'
              target=root/'charts'/name;target.parent.mkdir(exist_ok=True);target.write_bytes(data)
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
                  meta=yaml.safe_load(archive.extractfile('k8gb/Chart.yaml').read())
              for key in ('name','version','appVersion','kubeVersion'):
                  assert meta.get(key)==row.get(key),(key,row['version'])
              command=['helm','template','k8gb',str(target),'--kube-version',cap]
              run=subprocess.run(command,capture_output=True,text=True,timeout=30)
              (root/(row['version']+'-render.yaml')).write_text(run.stdout)
              (root/(row['version']+'-render.log')).write_text(run.stderr)
              (root/(row['version']+'-chart.yaml')).write_text(yaml.safe_dump(meta,sort_keys=False))
              report['charts'].append({'version':row['version'],'appVersion':row['appVersion'],'kubeVersion':row['kubeVersion'],'url':url,'digest':row['digest'],'render_exit_code':run.returncode})
          report['captured_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (root/'chart-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: k8gb-chart-verification
          path: bounty-evidence/
          retention-days: 7
